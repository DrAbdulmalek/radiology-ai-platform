# Docker Compose — Radiology AI Platform Development Stack
# Usage: docker-compose -f setup/docker-compose.yml up -d

version: "3.9"

services:
  # ────────────────────────────────────────────────────────────
  # PACS Server — Orthanc
  # ────────────────────────────────────────────────────────────
  orthanc:
    image: orthancteam/orthanc:24.7.2
    container_name: radiology-orthanc
    restart: unless-stopped
    ports:
      - "8042:8042"  # REST API + Web UI
      - "4242:4242"  # DICOM protocol
    environment:
      ORTHANC_NAME: "Radiology AI Platform"
      ORTHANC_PASSWORD: "${ORTHANC_PASSWORD:-change_me}"
      ORTHANC_JSON: |
        {
          "AuthenticationEnabled": true,
          "RemoteAccessAllowed": true,
          "RegisteredUsers": {
            "admin": "${ORTHANC_PASSWORD:-change_me}"
          },
          "DicomAet": "ORTHANC",
          "DicomPort": 4242,
          "HttpPort": 8042,
          "PostgreSQL": {
            "EnableIndex": true,
            "EnableStorage": false,
            "Host": "postgres",
            "Port": 5432,
            "Database": "orthanc",
            "Username": "${POSTGRES_USER:-radiology_admin}",
            "Password": "${POSTGRES_PASSWORD:-change_me}"
          },
          "AwsS3Storage": {
            "Enable": true,
            "BucketName": "radiology-dicom",
            "Region": "us-east-1",
            "Endpoint": "http://minio:9000",
            "AccessKey": "${MINIO_ROOT_USER:-minioadmin}",
            "SecretKey": "${MINIO_ROOT_PASSWORD:-change_me}",
            "Encryption": true
          }
        }
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    depends_on:
      - postgres
      - minio
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Primary Database — PostgreSQL
  # ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4-alpine
    container_name: radiology-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-radiology_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
      POSTGRES_DB: "radiology"
      POSTGRES_MULTIPLE_DATABASES: "orthanc,milvus,keycloak"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radiology_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Object Storage — MinIO (S3-compatible)
  # ────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: radiology-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change_me}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Vector Database — Milvus
  # ────────────────────────────────────────────────────────────
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: radiology-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - radiology-net

  milvus-minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: radiology-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - radiology-net

  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: radiology-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # metrics
    depends_on:
      - milvus-etcd
      - milvus-minio
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Message Broker — Redis
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: radiology-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:-change_me}" --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # API Service — FastAPI
  # ────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: setup/Dockerfile.api
    container_name: radiology-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      orthanc:
        condition: service_started
    volumes:
      - ../src:/app/src
      - ../data:/app/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Background Worker — Celery
  # ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: setup/Dockerfile.worker
    container_name: radiology-worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - ../src:/app/src
      - ../data:/app/data
      - ../models:/app/models
    command: celery -A src.worker.celery_app worker --loglevel=info --concurrency=2
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Celery Monitor — Flower
  # ────────────────────────────────────────────────────────────
  flower:
    image: mher/flower:2.0.1
    container_name: radiology-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-change_me}@redis:6379/0
      - FLOWER_BASIC_AUTH=admin:${FLOWER_PASSWORD:-change_me}
    depends_on:
      - redis
      - worker
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Monitoring — Prometheus
  # ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: radiology-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - radiology-net

  # ────────────────────────────────────────────────────────────
  # Monitoring — Grafana
  # ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: radiology-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - radiology-net

# ────────────────────────────────────────────────────────────
# Networks
# ────────────────────────────────────────────────────────────
networks:
  radiology-net:
    driver: bridge
    name: radiology-network

# ────────────────────────────────────────────────────────────
# Volumes
# ────────────────────────────────────────────────────────────
volumes:
  orthanc_data:
  postgres_data:
  minio_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  redis_data:
  prometheus_data:
  grafana_data:
